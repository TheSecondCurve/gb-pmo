name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # S19：日历日一律北京时区。测试期望值按本地时区计算（setHours），
      # 实现按北京日锚点（bjDayStartMs），CI 必须与部署环境同为 Asia/Shanghai。
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:scenarios
      - run: npm run check:skill
      - run: npm run coverage
      - run: npm run build
