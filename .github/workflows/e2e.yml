name: E2E

# e2e 独立 workflow（engineering-standards §5）：不挡合并——它不是分支保护的必需检查项。
# 真实生产形态（build + 单进程托管 dist/ + 真 SQLite），7 条业务旅程见 e2e/journeys.spec.ts。
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 19 * * *' # 每日 03:00 北京（UTC 19:00）兜底跑一次，防依赖/上游漂移
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
