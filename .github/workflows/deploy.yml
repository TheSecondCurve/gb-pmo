# 合并 main 即发布:hk-build 自托管 runner 构建 gb-pmo 镜像推 ACR,
# 再经 SSH 受限密钥(forced command)部署到 hk-dev（85.189.89.26:3355，与 gb-crm 同模式；
# 旧香港测试机 207.57.130.82 已于 2026-11-06 迁移下线，deploy.yml 当时漏改指向）。
# provenance: false——个人版 ACR 不收 buildx attestation 的 OCI empty manifest。
name: deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-deploy:
    runs-on: [self-hosted, hk-build]
    steps:
      - uses: actions/checkout@v4

      - name: 登录 ACR(重试抗瞬断)
        run: |
          for i in 1 2 3 4 5; do
            echo "${{ secrets.ACR_PASSWORD }}" | docker login "${{ secrets.ACR_REGISTRY }}" -u "${{ secrets.ACR_USERNAME }}" --password-stdin && break
            echo "login 失败,第 $i 次重试"; sleep 5
          done

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ${{ secrets.ACR_REGISTRY }}/thesecondcurve/gb-pmo:${{ github.sha }}
            ${{ secrets.ACR_REGISTRY }}/thesecondcurve/gb-pmo:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: SSH 受限部署到测试机
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_HOSTKEY }}" > ~/.ssh/known_hosts
          ssh -p 3355 -i ~/.ssh/deploy_key deploy@85.189.89.26
